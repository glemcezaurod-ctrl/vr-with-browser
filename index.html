<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vision Pro X — Stereoscopic 60 FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: black; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; position: fixed; width: 100%; height: 100%; }
        
        .vision-container { display: flex; width: 100vw; height: 100vh; }
        .screen { flex: 1; height: 100vh; position: relative; overflow: hidden; border-right: 1px solid rgba(255,255,255,0.1); }
        
        .vision-space { 
            width: 100%; height: 100%; position: relative; 
            perspective: 1000px; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
        }

        /* Стеклянные окна */
        .vision-window {
            position: absolute; width: 220px; height: 280px;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            color: white; display: flex; flex-direction: column; touch-action: none;
            will-change: transform, left, top;
        }

        .window-header {
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .window-title { font-size: 13px; font-weight: 600; opacity: 0.9; }
        .window-controls { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .dot.close { background: #ff453a; }

        .window-content { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .widget { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); }

        /* Интерфейс управления */
        .ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .dock { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 10px 20px; 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;
        }
        .dock-item { font-size: 24px; cursor: pointer; transition: transform 0.2s; }
        .dock-item:active { transform: scale(1.3); }

        .gyro-btn {
            position: absolute; top: 20px; left: 20px; padding: 10px 20px;
            background: rgba(10, 132, 255, 0.8); color: white; border-radius: 20px;
            border: none; pointer-events: auto; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="vision-container">
        <div class="screen" id="left-eye"><div class="vision-space"></div></div>
        <div class="screen" id="right-eye"><div class="vision-space"></div></div>
    </div>

    <div class="ui-layer">
        <button class="gyro-btn" onclick="requestGyro()">Включить VR</button>
        <div class="dock">
            <div class="dock-item" onclick="spawnApp('📱')">📱</div>
            <div class="dock-item" onclick="spawnApp('🌐')">🌐</div>
            <div class="dock-item" onclick="spawnApp('📝')">📝</div>
            <div class="dock-item" onclick="spawnApp('📷')">📷</div>
        </div>
    </div>

    <script>
        let zIndex = 100;
        let isVR = false;

        // Настройка синхронизации: двигаем оба окна одновременно
        function syncWindows(syncId, left, top) {
            const pair = document.querySelectorAll(`[data-sync-id="${syncId}"]`);
            pair.forEach(win => {
                win.style.left = left + 'px';
                win.style.top = top + 'px';
            });
        }

        function spawnApp(type) {
            const syncId = 'app_' + Date.now();
            const startX = 50 + Math.random() * 50;
            const startY = 100 + Math.random() * 50;

            createWindow('left-eye', type, syncId, startX, startY);
            createWindow('right-eye', type, syncId, startX, startY);
        }

        function createWindow(eyeId, type, syncId, x, y) {
            const space = document.querySelector(`#${eyeId} .vision-space`);
            const win = document.createElement('div');
            win.className = 'vision-window';
            win.setAttribute('data-sync-id', syncId);
            win.style.left = x + 'px';
            win.style.top = y + 'px';

            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${type} System</span>
                    <div class="window-controls"><div class="dot close"></div></div>
                </div>
                <div class="window-content">
                    <div class="widget">${type} Running...</div>
                    <div class="widget" style="font-size: 10px; color: #888;">CPU: 2% | 60 FPS</div>
                </div>
            `;

            // Закрытие пары
            win.querySelector('.close').onclick = () => {
                document.querySelectorAll(`[data-sync-id="${syncId}"]`).forEach(el => el.remove());
            };

            // Drag-and-Drop Логика
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            const start = (e) => {
                isDragging = true;
                const t = e.touches ? e.touches[0] : e;
                offset.x = t.clientX - win.offsetLeft;
                offset.y = t.clientY - win.offsetTop;
                document.querySelectorAll(`[data-sync-id="${syncId}"]`).forEach(el => el.style.zIndex = zIndex++);
            };

            const move = (e) => {
                if (!isDragging) return;
                const t = e.touches ? e.touches[0] : e;
                const newX = t.clientX - offset.x;
                const newY = t.clientY - offset.y;
                syncWindows(syncId, newX, newY);
            };

            const end = () => isDragging = false;

            win.addEventListener('mousedown', start);
            win.addEventListener('touchstart', start, {passive: false});
            window.addEventListener('mousemove', move);
            window.addEventListener('touchmove', move, {passive: false});
            window.addEventListener('mouseup', end);
            window.addEventListener('touchend', end);

            space.appendChild(win);
        }

        // VR Гироскоп
        function requestGyro() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(e) {
            const beta = Math.min(30, Math.max(-30, e.beta)) / 2; 
            const gamma = Math.min(30, Math.max(-30, e.gamma)) / 2;
            
            document.querySelectorAll('.vision-window').forEach(win => {
                win.style.transform = `rotateX(${-beta}deg) rotateY(${gamma}deg) translateZ(20px)`;
            });
        }

        // Старт
        spawnApp('📱');
        spawnApp('📝');

    </script>
</body>
</html>
